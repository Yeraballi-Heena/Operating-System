[build]
target = "x86_64-unknown-none"

[alias]
kbuild = "build --package integrate-kernel --target x86_64-unknown-none"
kbuild-release = "build --package integrate-kernel --target x86_64-unknown-none --release"

[target.x86_64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C", "link-arg=-Tkernel/linker.ld",
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-zmax-page-size=0x1000",
    "-C", "relocation-model=static",
    "-C", "code-model=kernel",
    "-C", "force-frame-pointers=yes",
]
